<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agregar actividad · Base de Datos 2 (UPLA)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <div class="brand">
          <div class="brand__title">Base de Datos 2</div>
          <div class="brand__subtitle">
            UPLA · Panel de registro · Howard Achcaray Cortez
          </div>
        </div>
        <div class="topbar__actions">
          <a class="btn btn--ghost" href="./index.html">Volver</a>
          <button id="btnLogout" class="btn btn--ghost" type="button">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="container main">
      <section id="loginCard" class="card">
        <div class="card__header">
          <h2 class="card__title">Iniciar sesión</h2>
          <p class="card__hint">Para agregar/editar actividades debes ingresar tus credenciales.</p>
        </div>

        <form id="loginForm" class="form">
          <div class="grid">
            <label class="field">
              <span class="field__label">Usuario</span>
              <input id="loginUser" type="text" autocomplete="username" required />
            </label>
            <label class="field">
              <span class="field__label">Contraseña</span>
              <input id="loginPass" type="password" autocomplete="current-password" required />
            </label>
          </div>
          <div class="form__actions">
            <button class="btn" type="submit">Entrar</button>
          </div>
        </form>
      </section>

      <section id="activityCard" class="card" hidden>
        <div class="card__header">
          <h2 class="card__title">Publicar una actividad</h2>
          <p class="card__hint">Se guardará en este navegador y se verá en la página principal.</p>
        </div>

        <form id="activityForm" class="form">
          <div class="grid">
            <label class="field">
              <span class="field__label">Semana</span>
              <input id="week" type="number" min="1" max="18" value="1" required />
            </label>

            <label class="field">
              <span class="field__label">Fecha</span>
              <input id="date" type="date" required />
            </label>

            <label class="field grid__span2">
              <span class="field__label">Título</span>
              <input id="title" type="text" maxlength="120" required />
            </label>

            <label class="field grid__span2">
              <span class="field__label">Descripción</span>
              <textarea id="description" rows="3" maxlength="600"></textarea>
            </label>

            <label class="field grid__span2">
              <span class="field__label">Enlace (opcional)</span>
              <input id="link" type="url" inputmode="url" />
            </label>

            <label class="field grid__span2">
              <span class="field__label">Adjuntar PDF (opcional)</span>
              <input id="pdf" type="file" accept="application/pdf" />
              <div id="pdfInfo" class="hint"></div>
              <button id="btnRemovePdf" class="btn btn--ghost mini" type="button" hidden>Quitar PDF</button>
            </label>
          </div>

          <div id="pdfPreviewWrap" class="pdfPreviewWrap" hidden>
            <div class="pdfPreviewHead">
              <div class="pdfPreviewTitle">Previsualización</div>
              <a id="pdfPreviewOpen" class="btn btn--ghost mini" target="_blank" rel="noopener noreferrer">Abrir en pestaña</a>
            </div>
            <iframe id="pdfPreview" class="pdfFrame" title="Previsualización PDF"></iframe>
          </div>

          <div class="form__actions">
            <button class="btn" type="submit">Guardar</button>
            <button id="btnReset" class="btn btn--ghost" type="button">Limpiar</button>
          </div>
        </form>
      </section>
    </main>

    <dialog id="dialog" class="dialog">
      <form method="dialog" class="dialog__panel">
        <h3 id="dialogTitle" class="dialog__title">Mensaje</h3>
        <p id="dialogBody" class="dialog__body"></p>
        <div class="dialog__actions">
          <button class="btn" value="ok">Aceptar</button>
        </div>
      </form>
    </dialog>

    <script src="./pdfStore.js"></script>
    <script src="./add.js"></script>
  </body>
</html>
